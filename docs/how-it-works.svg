<svg xmlns="http://www.w3.org/2000/svg" width="980" height="318" viewBox="0 0 980 318"><rect x="0.5" y="0.5" width="979" height="317" rx="14" fill="#ffffff" stroke="#e2e0d8"/><text x="490.0" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="490.0" dy="0.0">How the report typesetter works</tspan></text><rect x="5.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="33.0" cy="96" r="15" fill="#f2c14e"/><text x="33.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="33.0" dy="0.0">1</tspan></text><text x="19.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="19.0" dy="0.0">Your folder</tspan></text><text x="19.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="19.0" dy="0.0">Your article and its</tspan><tspan x="19.0" dy="17.8">photographs, in one</tspan><tspan x="19.0" dy="17.8">folder on your</tspan><tspan x="19.0" dy="17.8">computer.</tspan></text><line x1="178.0" y1="166.0" x2="193.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M190.0,158.0 L202.0,166.0 L190.0,174.0 Z" fill="#8fd1d5"/><rect x="205.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="233.0" cy="96" r="15" fill="#f2c14e"/><text x="233.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="233.0" dy="0.0">2</tspan></text><text x="219.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="219.0" dy="0.0">Ask Claude</tspan></text><text x="219.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="219.0" dy="0.0">Open the folder in</tspan><tspan x="219.0" dy="17.8">the Claude app and</tspan><tspan x="219.0" dy="17.8">ask for the report.</tspan></text><line x1="378.0" y1="166.0" x2="393.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M390.0,158.0 L402.0,166.0 L390.0,174.0 Z" fill="#8fd1d5"/><rect x="405.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="433.0" cy="96" r="15" fill="#323748"/><text x="433.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="433.0" dy="0.0">3</tspan></text><text x="419.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="419.0" dy="0.0">Laid out</tspan></text><text x="419.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="419.0" dy="0.0">Claude designs the</tspan><tspan x="419.0" dy="17.8">pages in the PFC</tspan><tspan x="419.0" dy="17.8">report style.</tspan></text><line x1="578.0" y1="166.0" x2="593.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M590.0,158.0 L602.0,166.0 L590.0,174.0 Z" fill="#8fd1d5"/><rect x="605.0" y="66" width="170" height="200" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="633.0" cy="96" r="15" fill="#323748"/><text x="633.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="633.0" dy="0.0">4</tspan></text><text x="619.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="619.0" dy="0.0">Words checked</tspan></text><text x="619.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="619.0" dy="0.0">It proves the text</tspan><tspan x="619.0" dy="17.8">matches your article</tspan><tspan x="619.0" dy="17.8">word for word, or it</tspan><tspan x="619.0" dy="17.8">stops.</tspan></text><line x1="778.0" y1="166.0" x2="793.0" y2="166.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M790.0,158.0 L802.0,166.0 L790.0,174.0 Z" fill="#8fd1d5"/><rect x="805.0" y="66" width="170" height="200" rx="12" fill="#323748"/><circle cx="833.0" cy="96" r="15" fill="#8fd1d5"/><text x="833.0" y="101.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="833.0" dy="0.0">5</tspan></text><text x="819.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="819.0" dy="0.0">PDF and web page</tspan></text><text x="819.0" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="819.0" dy="0.0">A finished A4 PDF</tspan><tspan x="819.0" dy="17.8">and a web page,</tspan><tspan x="819.0" dy="17.8">beside your article.</tspan></text><circle cx="370.0" cy="298" r="8" fill="#f2c14e"/><text x="386.0" y="303" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6f7280" text-anchor="start"><tspan x="386.0" dy="0.0">You do these</tspan></text><circle cx="530.0" cy="298" r="8" fill="#323748"/><text x="546.0" y="303" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6f7280" text-anchor="start"><tspan x="546.0" dy="0.0">Claude does these</tspan></text></svg>